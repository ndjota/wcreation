%% ACL WCreation — denegación por defecto vía authorization.no_match = deny
%% Publicación permitida solo bajo wcreation/{tenant}/{CN_cert}/...
%% El CN del certificado cliente se expone como ${username} cuando mqtt.peer_cert_as_username = "cn".

{allow, all, publish, ["wcreation/+/${username}/telemetry"]}.
{allow, all, publish, ["wcreation/+/${username}/event"]}.
{allow, all, publish, ["wcreation/+/${username}/status"]}.
{allow, all, subscribe, ["wcreation/+/${username}/cmd/#"]}.

%% Ingest mqtt-bridge (cert CN=SN-BRIDGE-001): suscripción a telemetría/eventos de todos los dispositivos (solo dev; en prod usar ACL por tenant o plugin EMQX).
{allow, {username, "SN-BRIDGE-001"}, subscribe, ["wcreation/+/+/telemetry"]}.
{allow, {username, "SN-BRIDGE-001"}, subscribe, ["wcreation/+/+/event"]}.
{allow, {username, "SN-BRIDGE-001"}, subscribe, ["wcreation/+/+/status"]}.
