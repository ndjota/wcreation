name: wcreation

networks:
  wcreation-dev:
    driver: bridge

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: wcreation-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wcreation_dev}
      POSTGRES_DB: wcreation
    ports:
      - "${WCREATION_PG_PORT:-5433}:5432"
    volumes:
      - wcreation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wcreation"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - wcreation-dev

  redis:
    image: redis:7-alpine
    container_name: wcreation-redis
    restart: unless-stopped
    ports:
      - "${WCREATION_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wcreation-dev

  emqx:
    image: emqx/emqx:5.8
    container_name: wcreation-emqx
    restart: unless-stopped
    user: root
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
      EMQX_LOG__CONSOLE_HANDLER__LEVEL: warning
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - ./emqx/etc/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/etc/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ../certs/broker:/opt/emqx/etc/certs:ro
      - ../certs/ca/ca.crt:/opt/emqx/etc/certs/ca-root.crt:ro
    networks:
      - wcreation-dev

  mailhog:
    image: mailhog/mailhog:latest
    container_name: wcreation-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - wcreation-dev

volumes:
  wcreation_pgdata:
